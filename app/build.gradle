plugins {
    id 'org.openjfx.javafxplugin' version '0.0.11'
    id 'org.beryx.jlink' version '2.26.0'
    id 'antlr'
    id 'idea'
    id 'application'
}

checkstyleMain.source = "src/main/java"

javafx {
    // 升级到 21 LTS：18.0.2 在 macOS 14+ 上启动即崩溃
    // （-[NSWindow _setFrameCommon:display:fromServer:] 的已知 bug，官方在 17.0.10+ / 21+ 修复）
    version = "21.0.12"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.base']
}

mainClassName = "cc.cc1234.Application"

def runArgsValue = [
        "-XX:+UnlockExperimentalVMOptions",
        // required due to a bug in Java: https://github.com/javafxports/openjdk-jfx/issues/175
        "-Djdk.gtk.version=2",
        "-Dfile.encoding=utf-8",
        "--add-exports=javafx.controls/com.sun.javafx.scene.control.behavior=com.jfoenix",
        "--add-exports=javafx.base/com.sun.javafx.binding=com.jfoenix",
        "--add-exports=javafx.base/com.sun.javafx.event=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.stage=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.scene=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.geom=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.scene.text=com.jfoenix",
        "--add-exports=javafx.controls/com.sun.javafx.scene.control.inputmap=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.scene.traversal=com.jfoenix",
        "--add-exports=javafx.controls/com.sun.javafx.scene.control=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.util=com.jfoenix",
        "--add-exports=javafx.graphics/com.sun.javafx.util=com.jfoenix",
        "--add-opens=java.base/java.lang.reflect=com.jfoenix"
]

run {
    jvmArgs = runArgsValue
}

applicationDefaultJvmArgs = runArgsValue

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    addExtraDependencies("javafx")
    forceMerge("jackson", "log4j-api")
    mergedModule {
        // slf4j 2.x 的 log4j-slf4j2-impl 在合并模块中 provides SLF4JServiceProvider，
        // 但插件生成的 module-info 缺少 requires org.slf4j，导致 javac 报“程序包 org.slf4j.spi 不可见”。
        requires 'org.slf4j'
        // 指定 mergedModule 配置后，插件不再自动补全 jdeps 分析出的 requires，
        // 以下 JDK 模块必须显式声明，否则运行时会抛 IllegalAccessError / NoClassDefFoundError。
        requires 'java.logging'
        requires 'java.security.sasl'
        requires 'java.naming'
        requires 'java.management'
        requires 'java.prefs'
        requires 'java.rmi'
        requires 'java.sql'
        requires 'java.xml'
        requires 'java.desktop'
        requires 'java.security.jgss'
        requires 'jdk.unsupported'
        requires 'java.scripting'
        requires 'java.compiler'
        requires 'java.net.http'
        // 缺少 jdk.crypto.ec 时，内置运行时的 HTTPS 请求会握手失败（SSLHandshakeException: handshake_failure）
        requires 'jdk.crypto.ec'
        // 合并模块里包含 RichTextFX / Flowless / jfoenix 等依赖，它们的类继承 javafx 控件，
        // 必须显式 requires javafx 模块，否则加载节点视图 FXML 时抛 IllegalAccessError，
        // 连接任务根本没机会启动（表现为一直转圈、无报错）。
        requires 'javafx.base'
        requires 'javafx.graphics'
        requires 'javafx.controls'
        requires 'javafx.fxml'
        // 把 log4j-slf4j2-impl 的 provider 重新声明进合并模块，
        // 否则 jlink 后 SLF4J 找不到 provider，应用和 Curator 的日志全部丢失。
        provides('org.slf4j.spi.SLF4JServiceProvider')
                .with('org.apache.logging.slf4j.SLF4JServiceProvider')
        uses 'org.apache.logging.log4j.spi.Provider'
        uses 'org.apache.logging.log4j.core.util.ContextDataProvider'
        uses 'org.apache.logging.log4j.util.PropertySource'
        uses 'org.apache.logging.log4j.message.ThreadDumpMessage.ThreadInfoFactory'
        provides('org.apache.logging.log4j.spi.Provider')
                .with('org.apache.logging.log4j.core.impl.Log4jProvider')
        provides('org.apache.logging.log4j.core.util.ContextDataProvider')
                .with('org.apache.logging.log4j.core.impl.ThreadContextDataProvider')
        provides('org.apache.logging.log4j.util.PropertySource')
                .with('org.apache.logging.log4j.util.EnvironmentPropertySource',
                        'org.apache.logging.log4j.util.SystemPropertiesPropertySource')
        provides('org.apache.logging.log4j.message.ThreadDumpMessage.ThreadInfoFactory')
                .with('org.apache.logging.log4j.core.message.ExtendedThreadInfoFactory')
    }
    launcher {
        name = 'prettyZoo'
        jvmArgs = runArgsValue
    }
    jpackage {
        def os = org.gradle.internal.os.OperatingSystem.current()
        installerOptions = [
                '--resource-dir', 'src/main/resources',
                '--name', 'PrettyZoo',
                '--app-version', "${project.version}",
                '--description', 'Pretty nice Zookeeper GUI',
                '--copyright', 'Apache License',
                '--vendor', 'vran'
        ]
        if (os.windows) {
            icon = 'src/main/resources/assets/icon/icon.ico'
            installerOptions += [
                    '--win-per-user-install', '--win-dir-chooser',
                    '--win-shortcut'
            ]
        }

        if (os.macOsX) {
            installerType = 'dmg'
            icon = 'src/main/resources/assets/icon/Icon.icns'
        }

        if (os.linux) {
            icon = 'src/main/resources/assets/icon/icon.png'
            installerOptions += [
                    '--linux-deb-maintainer', 'vran_dev@foxmail.com',
                    '--linux-rpm-license-type', 'GPLv3',
                    '--linux-shortcut'
            ]
        }
    }
}

jpackage {
    doLast {
        file("${buildDir}/jpackage/prettyZoo-${version}.dmg").renameTo("${buildDir}/jpackage/prettyZoo-mac.dmg")
        file("${buildDir}/jpackage/prettyZoo-${version}.msi").renameTo("${buildDir}/jpackage/prettyZoo-win.msi")
        file("${buildDir}/jpackage/prettyZoo-${version}.rpm").renameTo("${buildDir}/jpackage/prettyZoo-linux.rpm")
        file("${buildDir}/jpackage/prettyZoo-${version}.deb").renameTo("${buildDir}/jpackage/prettyZoo-linux.deb")
    }
}

task releaseWinZip(type: Zip, dependsOn: jpackage) {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.windows) {
        from "${buildDir}/jpackage/prettyZoo"
        archiveFileName = "prettyZoo-win.zip"
        destinationDirectory = file("$buildDir/jpackage")
    }
}

task releaseJarZip(dependsOn: distZip) {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.windows) {
        file("${buildDir}/distributions/app-${version}.zip").renameTo("${buildDir}/jpackage/prettyZoo-win-java17.zip")
        println "windows jar zip release ok"
        return
    }
    if (os.linux) {
        file("${buildDir}/distributions/app-${version}.zip").renameTo("${buildDir}/jpackage/prettyZoo-linux-java17.zip")
        println "linux jar zip release ok"
        return
    }
    if (os.macOsX) {
        file("${buildDir}/distributions/app-${version}.zip").renameTo("${buildDir}/jpackage/prettyZoo-mac-java17.zip")
        println "macOsX jar zip release ok"
        return
    }
}

dependencies {
    api project(':core')
    api project(':specification')
    antlr "org.antlr:antlr4:4.9" // use ANTLR version 4

    implementation 'com.google.guava:guava'
    implementation('org.fxmisc.richtext:richtextfx') {
        exclude group: 'org.openjfx'
    }
    implementation 'org.antlr:antlr4-runtime'
    implementation 'com.jfoenix:jfoenix'
    implementation 'commons-io:commons-io'
}

configJavafxRun {
    dependsOn classes
}

task updateVersion {
    def versionFileDir = projectDir.getAbsolutePath() + '/src/main/java/cc/cc1234/version/Version.java'
    def oldVersionStr = findOldVersionStr(versionFileDir)
    def newVersionValue = version.toString().split("-")[0]
    def newVersionStr = "    public static final String VERSION = \"" + newVersionValue + "\";"
    //旧版本和新版本不一样, 进行替换
    if (oldVersionStr.toString().trim() != newVersionStr.trim()) {
        def updatedContent = new File(versionFileDir).getText('UTF-8').replaceAll(oldVersionStr, newVersionStr)
        new File(versionFileDir).write(updatedContent, 'UTF-8')
    }
}

def findOldVersionStr(path) {
    def readerString = ""
    new File(path).withReader('UTF-8') { reader ->
        reader.eachLine {
            //读取一行，如果发现有"VERSION"字符，说明是我们要修改的那一行。
            if (it.contains("VERSION")) {
                //保存it到string，然后返回
                readerString <<= it
                return readerString
            }
        }
        return readerString
    }
}

compileJava {
    dependsOn updateVersion
}

sourceSets {
    main {
        java.srcDirs += 'gen/main/java'
        resources.srcDirs += 'gen/main/resources'
    }
}

